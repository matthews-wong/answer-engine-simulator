[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "answer-engine-simulator"
version = "0.1.0"
description = "Simulate how an AI answer engine would answer a query from your site content, and whether it would cite your pages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matthews Wong" }]
keywords = ["geo", "seo", "answer-engine", "rag", "tf-idf", "claude"]
dependencies = [
    "click>=8.1",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Optional: enables the Claude synthesis path. The tool runs fully offline without it.
claude = ["anthropic>=0.40"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
answer-engine-simulator = "answersim.cli:main"

[tool.setuptools.packages.find]
include = ["answersim*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
